on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *

permissions:
  contents: write

jobs:
  update:
    name: update README
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Update
      run: |
        git config --global user.name "$GITHUB_REPOSITORY_OWNER"
        git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
        python message.py
        git add -A
        git commit -m 'Update README.md with a random message' || exit 0
        git push
